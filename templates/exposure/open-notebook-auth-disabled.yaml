id: open-notebook-auth-disabled

info:
  name: Open Notebook - API Served With Authentication Disabled
  author: popy21
  severity: high
  description: |
    Open Notebook (lfnovo/open-notebook, ~39 900 étoiles, dernière release
    v1.15.0 du 2026-10-04) est un assistant de recherche auto-hébergé — « An
    Open Source implementation of Notebook LM » — qui ingère des sources
    (« PDFs, videos, audio, web pages, Office docs », dit le README) dans des
    carnets et les interroge via les fournisseurs de LLM que l'exploitant a
    configurés. api/main.py construit
    « FastAPI(title="Open Notebook API", description="API for Open Notebook -
    Research Assistant", ...) », servi par uvicorn sur le port 5055
    (supervisord.conf : « uvicorn api.main:app --host %(ENV_API_HOST)s --port
    5055 »), l'interface web Next.js écoutant sur 8502.
    GET /api/auth/status est déclaré par api/routers/auth.py — « router =
    APIRouter(prefix="/auth", tags=["auth"]) », puis « @router.get("/status") »
    — et monté par « app.include_router(auth.router, prefix="/api",
    tags=["auth"]) ». Le handler calcule « auth_enabled =
    bool(get_secret_from_env("OPEN_NOTEBOOK_PASSWORD")) » et rend
    « {"auth_enabled": auth_enabled, "message": "Authentication is required"
    if auth_enabled else "Authentication is disabled"} ». Sur une instance sans
    mot de passe, le corps est donc exactement
    {"auth_enabled":false,"message":"Authentication is disabled"} — FastAPI
    sérialise compact, dans l'ordre d'insertion du dict — et c'est la réponse
    elle-même qui prouve que l'API est ouverte, pas une inférence tirée d'un
    code HTTP.
    La route est joignable dans les deux états du produit : api/main.py la
    place dans les « excluded_paths » de PasswordAuthMiddleware, avec « / »,
    « /health », « /docs », « /openapi.json », « /redoc » et « /api/config »,
    et le store d'authentification de l'interface (frontend/src/lib/stores/
    auth-store.ts, checkAuthRequired) lit auth_enabled sur cette route — faux,
    il marque la session authentifiée avec « token: 'not-required' », sans
    page de connexion. Une instance protégée y rend
    {"auth_enabled":true,"message":"Authentication is required"} : seul le
    corps sépare les deux.
    L'absence d'authentification est un défaut de configuration, pas une
    fonctionnalité absente. api/auth.py ouvre dispatch() sur « # Skip
    authentication if no password is set » puis « if not self.password: return
    await call_next(request) » — toute vérification est sautée, sur toutes les
    routes, dès que OPEN_NOTEBOOK_PASSWORD (ou OPEN_NOTEBOOK_PASSWORD_FILE, lu
    en premier par get_secret_from_env) n'est pas défini. Le docker-compose.yml
    officiel ne définit pas cette variable — ses seules variables sont
    OPEN_NOTEBOOK_ENCRYPTION_KEY et la connexion SurrealDB — tout en publiant
    « "8502:8502"  # Web UI » et « "5055:5055"  # REST API » sur toutes les
    interfaces de l'hôte. .env.example le dit en toutes lettres (« Auth is
    fully disabled if unset. ») et docs/5-CONFIGURATION/security.md ajoute :
    « Without OPEN_NOTEBOOK_PASSWORD, authentication is off and anyone who can
    reach ports 8502 or 5055 can use the app and its stored provider keys. Open
    Notebook does not log a warning when the password is unset. »
    Le constat est confirmé par l'une des deux signatures que le même
    api/main.py sert hors authentification : « @app.get("/") » rend
    {"message":"Open Notebook API is running"}, et GET /openapi.json porte
    « "title":"Open Notebook API" », le titre passé au constructeur. Jamais sur
    le statut HTTP — /api/auth/status répond 200 dans les deux états — ni sur
    GET /health, dont le corps {"status":"healthy"} est générique. Le port 8502
    n'est pas visé : next.config.ts y réécrit « /api/:path* » vers l'API, donc
    /api/auth/status y rend le même document, mais « / » y est l'application
    Next.js et /openapi.json n'y est pas réécrit — l'instance jointe par ce
    port seul reste muette, par construction.
  impact: |
    GET /api/notebooks, « @router.get("/notebooks",
    response_model=List[NotebookResponse]) », énumère les carnets de recherche
    de l'exploitant — NotebookResponse porte id, name, description, archived,
    created, updated, source_count et note_count — et les vingt autres
    routeurs montés sous /api par api/main.py (sources, notes, search, chat,
    source_chat, models, credentials, podcasts, insights, commands…) répondent
    au même appelant anonyme, puisque le seul intergiciel d'authentification
    saute toute vérification. Un tiers lit donc les documents ingérés et les
    notes, interroge le corpus par /api/search et le fait résumer par les LLM
    configurés — à la charge de l'exploitant, dont les clés de fournisseur
    sont celles qui paient — et crée, modifie ou supprime carnets, sources et
    notes, les routeurs étant aussi en écriture.
    Le document que la route rend ne porte rien d'autre que l'aveu, mais c'est
    lui qui dit que le reste est ouvert : la documentation du produit
    elle-même décrit cet état comme « anyone who can reach ports 8502 or 5055
    can use the app and its stored provider keys ». Rien ne sera attribué —
    sans mot de passe il n'y a pas d'identité, donc aucun journal ne nommera
    l'appelant.
  remediation: |
    Définir OPEN_NOTEBOOK_PASSWORD dans le bloc « environment: » du service
    open_notebook — ou OPEN_NOTEBOOK_PASSWORD_FILE vers un secret Docker, lu en
    premier — et appliquer par « docker compose up -d » (un « restart » garde
    l'ancienne valeur, dit docs/5-CONFIGURATION/security.md). C'est le seul
    réglage natif : sans lui, api/auth.py saute toute vérification sur toutes
    les routes. Le mot de passe est unique et partagé (un « Bearer
    {password} » attendu par PasswordAuthMiddleware), pas un système de
    comptes : il ferme l'accès anonyme, il n'identifie personne.
    Ne pas publier les ports en attendant. Le README du dépôt le dit lui-même
    sous « Shared network or server? » : remplacer « "8502:8502" » et
    « "5055:5055" » par « "127.0.0.1:8502:8502" » et « "127.0.0.1:5055:5055" »,
    ou placer un intermédiaire qui authentifie devant les deux ports. Le port
    8502 compte autant que 5055 : next.config.ts y réécrit /api/* vers l'API,
    donc fermer 5055 seul ne ferme rien.
    Vérifier depuis l'extérieur du périmètre : « curl -s
    http://<hôte>:5055/api/auth/status » doit rendre
    « {"auth_enabled":true,"message":"Authentication is required"} », et
    « curl -s http://<hôte>:5055/api/notebooks » un 401 « Missing
    authorization header ». Après une exposition, tenir pour lus les carnets,
    les sources et les notes, relire les journaux des fournisseurs de LLM pour
    toute consommation non attribuée, et faire tourner les clés enregistrées
    dans /api/credentials — elles étaient utilisables par quiconque atteignait
    le port.
  reference:
    - https://github.com/lfnovo/open-notebook/blob/main/api/routers/auth.py
    - https://github.com/lfnovo/open-notebook/blob/main/api/auth.py
    - https://github.com/lfnovo/open-notebook/blob/main/api/main.py
    - https://github.com/lfnovo/open-notebook/blob/main/api/routers/notebooks.py
    - https://github.com/lfnovo/open-notebook/blob/main/docker-compose.yml
    - https://github.com/lfnovo/open-notebook/blob/main/docs/5-CONFIGURATION/security.md
    - https://github.com/lfnovo/open-notebook/blob/main/docs/7-DEVELOPMENT/api-reference.md
    - https://github.com/lfnovo/open-notebook/blob/main/frontend/next.config.ts
  metadata:
    max-request: 3
    vendor: lfnovo
    product: open-notebook
  tags: ai,llm,rag,open-notebook,notebooklm,exposure,unauth,misconfig

http:
  # Trois lectures au plus, deux en pratique. La première porte le constat :
  # get_auth_status() ne lit qu'une variable d'environnement et rend deux
  # constantes — aucune requête vers la base, aucun fournisseur joint, rien
  # d'écrit. Les deux suivantes confirment le produit, et la seconde ne part que
  # si la première n'a pas suffi : « / » rend quarante-deux octets,
  # /openapi.json le document entier de l'API, donc l'ordre va du plus léger
  # au plus lourd.
  #
  # En lecture seule, et strictement. Les routeurs montés sous /api lisent et
  # écrivent les carnets, les sources, les notes et les clés de fournisseur ;
  # /api/search et /api/chat feraient travailler les LLM de l'exploitant. Ce
  # sont les abus que le template signale, pas ce qu'un scanner a le droit de
  # faire pour les établir — GET /api/notebooks n'est pas joint non plus : le
  # constat tient sans lire les carnets.
  #
  # GET /health n'est pas interrogé : {"status":"healthy"} est la sonde de
  # n'importe quel service.
  - method: GET
    path:
      - "{{BaseURL}}/api/auth/status"
      - "{{BaseURL}}/"
      - "{{BaseURL}}/openapi.json"

    # req-condition accumule body_N pour que la preuve lie l'aveu à l'une des
    # deux signatures ; stop-at-first-match ferme la marche dès que « / » a
    # confirmé — sans lui, le moteur réévalue après /openapi.json et remonte
    # deux fois la même instance, et la troisième requête partirait pour rien.
    stop-at-first-match: true
    req-condition: true

    matchers:
      # Deux expressions, une par signature de confirmation, et chacune porte
      # l'aveu entier. La condition vaut « or » : l'une des deux suffit.
      #
      # L'aveu est le document de /api/auth/status pris d'un seul tenant, ancré
      # aux deux bouts : « auth_enabled » puis « message », dans l'ordre
      # d'insertion du dict que le handler construit, « false » sur le premier
      # et le littéral « Authentication is disabled » sur le second — les deux
      # valeurs que le handler rend ensemble, et seulement ensemble. L'ancrage
      # écarte le document composite d'une supervision qui recopierait la charge
      # utile sous une clé à elle, et l'ancrage de fin, la clé qu'une telle
      # supervision ajouterait derrière. Les \s* absorbent l'intermédiaire qui
      # réindente ce que FastAPI sérialise compact.
      #
      # Ni « "auth_enabled":false » seul — Bifrost rend « is_auth_enabled »,
      # SkyPilot « basic_auth_enabled », et un booléen d'authentification ne
      # nomme aucun produit — ni le message seul, qu'un autre service peut
      # écrire : c'est le couple, dans cette enveloppe, qui est celui d'Open
      # Notebook. « "auth_enabled":true » avec « Authentication is required »
      # est l'instance fermée, et elle ne passe pas.
      #
      # La première signature est le corps entier de « / » : {"message":"Open
      # Notebook API is running"}, un objet à une seule clé, ancré lui aussi.
      # La seconde est le titre du document OpenAPI, « "title":"Open Notebook
      # API" », celui que api/main.py passe au constructeur ; il n'est pas
      # ancré, parce qu'il vit au milieu d'un document dont le reste dépend de
      # la version.
      #
      # Le code HTTP n'entre dans aucune des deux, et pas par prudence :
      # /api/auth/status figure dans les excluded_paths du middleware, donc il
      # rend 200 à l'anonyme aussi bien sur une instance fermée que sur une
      # instance ouverte. Un matcher de statut ne séparerait rien — seul le
      # corps le fait.
      - type: dsl
        dsl:
          - 'regex("^\\{\\s*\"auth_enabled\"\\s*:\\s*false\\s*,\\s*\"message\"\\s*:\\s*\"Authentication is disabled\"\\s*\\}$", trim_space(body_1)) && regex("^\\{\\s*\"message\"\\s*:\\s*\"Open Notebook API is running\"\\s*\\}$", trim_space(body_2))'
          - 'regex("^\\{\\s*\"auth_enabled\"\\s*:\\s*false\\s*,\\s*\"message\"\\s*:\\s*\"Authentication is disabled\"\\s*\\}$", trim_space(body_1)) && regex("\"title\"\\s*:\\s*\"Open Notebook API\"", body_3)'

    # Pas d'extracteur, et c'est délibéré. Le corps de /api/auth/status ne porte
    # que deux constantes, toutes deux déjà fixées par le matcher : recopier
    # « Authentication is disabled » dans le rapport n'y ajouterait rien. Ce qui
    # daterait l'instance se lit dans /openapi.json, mais cette requête ne part
    # pas quand « / » a confirmé, et un extracteur posé sur body_3 serait vide
    # une fois sur deux. Les carnets, eux, se lisent sur /api/notebooks, que ce
    # template ne joint pas.
