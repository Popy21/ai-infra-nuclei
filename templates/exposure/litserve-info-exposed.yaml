id: litserve-info-exposed

info:
  name: LitServe - Unauthenticated Server Info Disclosure
  author: popy21
  severity: medium
  description: |
    LitServe (Lightning-AI/LitServe, ~3 900 étoiles, dépôt actif — « A minimal
    Python framework for building custom AI inference servers ») est le serveur
    de mise en production de modèles édité par Lightning AI : il enveloppe un
    LitAPI dans une application FastAPI et l'expose en HTTP.
    src/litserve/server.py enregistre ses routes internes dans
    _register_internal_endpoints(), où l'endpoint d'information est déclaré
    « @self.app.get(self.info_path, dependencies=[Depends(self.setup_auth())]) »
    puis « async def info(request: Request) -> Response: » — self.info_path vaut
    « /info » par défaut dans la signature du constructeur. Le handler rend
    littéralement, via une JSONResponse, le dictionnaire
    « {"model": self.model_metadata, "server": {"devices": self.devices,
    "workers_per_device": self.workers_per_device, "timeout": self.timeout,
    "stream": {lit_api.api_path: lit_api.stream for lit_api in
    self.litapi_connector}, "max_payload_size": self.max_payload_size,
    "track_requests": self.track_requests}} » — donc, en sortie compacte de
    Starlette, {"model":<métadonnées du modèle>,"server":{"devices":[...],
    "workers_per_device":<int>,"timeout":<...>,"stream":{"<api_path>":<bool>},
    "max_payload_size":<...>,"track_requests":<bool>}}. model_metadata vaut None
    par défaut (paramètre « model_metadata: Optional[dict] = None ») ; devices
    est la liste des identifiants d'accélérateurs construite au démarrage
    (« cpu », « cuda:0 », « mps:0 », …).
    L'absence d'authentification est un défaut de configuration par défaut, lu
    dans le même fichier. « def setup_auth(self, lit_api=None): » retourne le
    callback « authorize » du LitAPI s'il en porte un
    (« if hasattr(target, "authorize") and callable(target.authorize): return
    target.authorize »), sinon « api_key_auth » si la variable d'environnement
    LIT_SERVER_API_KEY est définie (« if os.environ.get("LIT_SERVER_API_KEY"):
    return api_key_auth »), et sinon « return no_auth ». no_auth (litserve/auth.py)
    est un passe-plat dont le corps ne vérifie rien : « def no_auth(): """...""" »
    et rien d'autre. Tant que le LitAPI ne définit pas authorize() et que
    LIT_SERVER_API_KEY n'est pas posée — le chemin par défaut du quickstart —,
    /info comme /predict répondent sans identifiant.
    L'objet « server » est propre à LitServe : aucun autre produit ne republie
    la conjonction « workers_per_device » + « max_payload_size » +
    « track_requests » dans un même bloc, sérialisés dans cet ordre de
    déclaration. C'est sur cette forme que porte le constat, jamais sur le seul
    statut HTTP — /info rend 200 sur n'importe quel serveur vivant.
  impact: |
    Un appelant anonyme obtient, en une lecture, la carte du déploiement : les
    accélérateurs disponibles (devices — donc le nombre et le type de GPU/CPU
    que l'instance sert), le nombre de workers par accélérateur
    (workers_per_device), le délai de traitement (timeout), la liste des chemins
    d'API montés avec leur mode de streaming (stream), la taille maximale de
    charge utile acceptée (max_payload_size) et l'état du suivi de requêtes
    (track_requests) ; model_metadata expose en tête toute métadonnée de modèle
    que l'exploitant a passée au serveur.
    Le renseignement n'est pas la seule perte. Le même serveur non protégé, par
    la même dépendance no_auth, sert l'endpoint d'inférence — POST /predict, ou
    l'API compatible OpenAI /v1/chat/completions selon le LitSpec monté — sans
    identifiant : l'inférence tourne aux frais de l'opérateur, sur son matériel,
    et /info vient d'en nommer les chemins et d'en dimensionner la capacité.
  remediation: |
    L'absence d'authentification n'est pas un oubli d'application mais le chemin
    par défaut de setup_auth(). Pour l'armer sans reverse proxy, deux voies
    documentées : définir la variable d'environnement LIT_SERVER_API_KEY côté
    serveur — setup_auth() bascule alors sur api_key_auth, qui exige l'en-tête
    « X-API-Key » sur /info comme sur /predict —, ou déclarer une méthode
    authorize() sur le LitAPI, qui devient la dépendance de toutes les routes.
    À défaut, la fermeture est réseau : ne pas publier le port du serveur (8000
    par défaut) sur une interface joignable depuis Internet, lier l'écoute à
    127.0.0.1 ou au réseau interne, et placer devant tout accès distant un
    reverse proxy qui authentifie l'ensemble du préfixe — /info, /predict et les
    routes compatibles OpenAI passent par la même dépendance nue.
    Vérifier depuis l'extérieur du périmètre que « curl -s http://<hote>:8000/info »
    ne rend plus l'objet décrit ici, et tenir pour connus d'un attaquant la
    topologie matérielle et les chemins d'inférence déjà observés le cas échéant.
  reference:
    - https://github.com/Lightning-AI/LitServe
    - https://github.com/Lightning-AI/LitServe/blob/main/src/litserve/server.py
    - https://github.com/Lightning-AI/LitServe/blob/main/src/litserve/auth.py
    - https://lightning.ai/docs/litserve/features/authentication
  metadata:
    max-request: 1
    vendor: lightning-ai
    product: litserve
  tags: ai,llm,litserve,lightning-ai,inference,exposure,unauth,misconfig

http:
  # Une seule lecture, sur la route interne d'information. Le handler info() ne
  # touche que des attributs fixés au démarrage — devices, workers_per_device,
  # les chemins montés — et n'exécute aucun modèle : le constat se lit sans rien
  # écrire ni rien faire tourner. Le même serveur nu porte POST /predict et,
  # selon le LitSpec, /v1/chat/completions, qui feraient de l'inférence aux
  # frais de l'exploitant ; ni l'un ni l'autre n'est interrogé ici.
  - method: GET
    path:
      - "{{BaseURL}}/info"

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "application/json"

      # Le document se lit en deux ancres jointes.
      #
      # La première exige qu'il s'ouvre sur la clé "model" — c'est le premier
      # champ du dictionnaire que rend info(), et l'ancrage en tête écarte le
      # même bloc "server" retrouvé au fond d'un document composite qu'une
      # supervision agrégerait sous une clé à elle : l'instance a servi le
      # document elle-même.
      #
      # La seconde porte tout le discriminant : l'objet "server" dans l'ordre de
      # déclaration du code source — devices (un tableau), workers_per_device
      # (un entier), timeout (un nombre ou false quand il est désactivé), stream
      # (un objet chemin -> booléen), max_payload_size (un nombre ou null),
      # track_requests (un booléen) — refermé par l'accolade du bloc puis celle
      # du document, en fin de chaîne. C'est la conjonction workers_per_device +
      # max_payload_size + track_requests qui est propre à LitServe ; aucune ne
      # porte de version ni de nom de modèle, donc le motif tient d'une instance
      # à l'autre. Les \s* tolèrent un intermédiaire qui réindente ce que
      # Starlette sérialise compact.
      - type: regex
        part: body
        condition: and
        regex:
          - '^\s*\{\s*"model"\s*:'
          - '"server"\s*:\s*\{\s*"devices"\s*:\s*\[[^\]]*\]\s*,\s*"workers_per_device"\s*:\s*\d+\s*,\s*"timeout"\s*:\s*(?:[0-9]+(?:\.[0-9]+)?|false)\s*,\s*"stream"\s*:\s*\{[^{}]*\}\s*,\s*"max_payload_size"\s*:\s*(?:[0-9]+(?:\.[0-9]+)?|null)\s*,\s*"track_requests"\s*:\s*(?:true|false)\s*\}\s*\}\s*$'

    extractors:
      # La topologie matérielle que l'instance expose : la liste des
      # accélérateurs sur lesquels tourne l'inférence non protégée.
      - type: json
        part: body
        name: devices
        json:
          - '.server.devices'
